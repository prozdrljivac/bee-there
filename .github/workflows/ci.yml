name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          python-version: "3.14"
          enable-cache: true
          cache-suffix: backend
          working-directory: backend
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Check types
        run: uv run --locked mypy
      - name: Test backend and container with coverage
        env:
          BEE_THERE_TEST_CONTAINER: "1"
        run: uv run --locked pytest --cov

  extension:
    name: Extension tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          python-version: "3.14"
          enable-cache: true
          cache-suffix: extension
          working-directory: backend
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extension/package-lock.json
          package-manager-cache: false
      - name: Install backend for the real API journey
        run: uv sync --locked --project ../backend
      - name: Set browser cache directory
        run: echo "PUPPETEER_CACHE_DIR=$RUNNER_TEMP/puppeteer" >> "$GITHUB_ENV"
      - name: Install locked extension dependencies
        run: npm ci
      - name: Install Chrome system dependencies
        run: |
          sudo apt-get update
          sudo env "PATH=$PATH" "PUPPETEER_CACHE_DIR=$PUPPETEER_CACHE_DIR" \
            npx --no-install puppeteer browsers install chrome --install-deps
      - name: Allow the bundled Chrome to use its sandbox
        # Ubuntu restricts user namespaces for Chrome for Testing by default.
        # Grant access only to this executable, not to all runner processes.
        run: |
          chrome="$(node --input-type=module -e 'import puppeteer from "puppeteer"; process.stdout.write(await puppeteer.executablePath())')"
          sudo tee /etc/apparmor.d/beethere-puppeteer >/dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile beethere-puppeteer "$chrome" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/beethere-puppeteer
      - name: Test extension and clean release journey
        run: npm test

  security:
    name: Project security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2
      - name: Scan dependencies, infrastructure configuration, and secrets
        run: bash scripts/scan-security.sh fs . .trivy-reports/project.json
      - name: Save project security report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-project
          path: .trivy-reports/project.json
          retention-days: 7
          if-no-files-found: warn

  publish:
    name: Backend image security and publish
    needs: [backend, extension, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set lowercase image name and full commit tag
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "tag=ghcr.io/${REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image for scanning
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2
      - name: Scan the built image before publishing
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          TRIVY_IMAGE_SRC: docker
        run: bash scripts/scan-security.sh image "$IMAGE_TAG" .trivy-reports/image.json
      - name: Save image security report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-image
          path: .trivy-reports/image.json
          retention-days: 7
          if-no-files-found: warn
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact scanned image
        id: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          docker push "$IMAGE_TAG"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE_TAG")"
          echo "digest=${digest##*@}" >> "$GITHUB_OUTPUT"
      - name: Record image release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo '### Backend image'
            printf 'Tag: `%s`\n\n' "$IMAGE_TAG"
            printf 'Digest: `%s`\n' "$IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
