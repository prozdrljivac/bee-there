<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BeeThere · Your next good plan</title>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <div class="popup">
      <header class="header">
        <a class="brand" href="popup.html" aria-label="BeeThere home">
          <h1 class="visually-hidden">BeeThere</h1>
          <img
            class="brand-logo brand-logo-light"
            src="assets/logo/beethere-logo-light.svg"
            alt=""
            aria-hidden="true"
          >
          <img
            class="brand-logo brand-logo-dark"
            src="assets/logo/beethere-logo-dark.svg"
            alt=""
            aria-hidden="true"
          >
        </a>
        <fieldset class="theme-switch">
          <legend class="visually-hidden">Theme</legend>
          <label for="theme-system">
            <input id="theme-system" type="radio" name="theme" value="system">
            <span>System</span>
          </label>
          <label for="theme-light">
            <input id="theme-light" type="radio" name="theme" value="light">
            <span>Light</span>
          </label>
          <label for="theme-dark">
            <input id="theme-dark" type="radio" name="theme" value="dark">
            <span>Dark</span>
          </label>
        </fieldset>
      </header>
      <main>
        <section class="events-section" aria-label="Upcoming events">
          <div class="section-heading">
            <h2>Upcoming events</h2>
          </div>
          <p id="status" role="status" aria-live="polite"></p>
          <div id="event-list" aria-live="polite" aria-busy="true"></div>
        </section>
      </main>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
