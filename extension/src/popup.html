<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BeeThere · Your next good plan</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <div class="popup">
      <header class="header">
        <a class="brand" href="popup.html" aria-label="BeeThere home">
          <h1>BeeThere</h1>
        </a>
      </header>
      <main>
        <section class="events-section" aria-label="Upcoming events">
          <div class="section-heading">
            <h2>Upcoming events</h2>
            <span class="from-today"><i></i>From today</span>
          </div>
          <p id="status" role="status" aria-live="polite"></p>
          <div id="event-list" aria-live="polite" aria-busy="true"></div>
        </section>
      </main>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
