<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BeeThere · Your next good plan</title>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup">
      <header class="header">
        <a class="brand" href="popup.html" aria-label="BeeThere home">
          <h1 class="visually-hidden">BeeThere</h1>
          <img
            class="brand-logo brand-logo-light"
            src="assets/logo/beethere-logo-light.svg"
            alt=""
            aria-hidden="true"
          />
          <img
            class="brand-logo brand-logo-dark"
            src="assets/logo/beethere-logo-dark.svg"
            alt=""
            aria-hidden="true"
          />
        </a>
        <fieldset class="theme-switch">
          <legend class="visually-hidden">Theme</legend>
          <label for="theme-system" title="System">
            <input id="theme-system" type="radio" name="theme" value="system" />
            <span class="theme-option">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <rect x="2" y="3" width="20" height="14" rx="2" />
                <path d="M8 21h8M12 17v4" />
              </svg>
              <span class="visually-hidden">System</span>
            </span>
          </label>
          <label for="theme-light" title="Light">
            <input id="theme-light" type="radio" name="theme" value="light" />
            <span class="theme-option">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" />
              </svg>
              <span class="visually-hidden">Light</span>
            </span>
          </label>
          <label for="theme-dark" title="Dark">
            <input id="theme-dark" type="radio" name="theme" value="dark" />
            <span class="theme-option">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.44.402.784a6.25 6.25 0 0 0 8.268 8.268c.344-.215.806-.004.803.42" />
              </svg>
              <span class="visually-hidden">Dark</span>
            </span>
          </label>
        </fieldset>
      </header>
      <main>
        <section class="events-section" aria-label="Upcoming events">
          <div class="section-heading">
            <h2>Upcoming events</h2>
          </div>
          <div class="discovery-controls">
            <p class="local-time">Novi Sad · Local dates and times</p>
            <div class="search-field">
              <img src="assets/discovery/search.svg" alt="" />
              <label for="title-query" class="visually-hidden"
                >Search event titles</label
              >
              <input
                id="title-query"
                type="search"
                placeholder="Search event titles"
                autocomplete="off"
              />
              <button
                id="clear-query"
                type="button"
                aria-label="Clear search"
                hidden
              >
                <img src="assets/discovery/close.svg" alt="" />
              </button>
            </div>
            <div class="filter-row">
              <button
                id="category-trigger"
                type="button"
                aria-expanded="false"
                aria-controls="category-menu"
              >
                <span>Categories</span
                ><img src="assets/discovery/chevron.svg" alt="" />
              </button>
              <button
                id="date-trigger"
                type="button"
                aria-expanded="false"
                aria-controls="date-menu"
              >
                <span>Date · Any</span
                ><img src="assets/discovery/chevron.svg" alt="" />
              </button>
            </div>
            <div id="category-chips" class="chips"></div>
          </div>
          <div
            id="category-menu"
            class="filter-menu"
            role="dialog"
            aria-label="Categories"
            hidden
          >
            <div class="menu-heading">
              <strong>Categories</strong
              ><button type="button" data-close aria-label="Close categories">
                <img src="assets/discovery/close.svg" alt="" />
              </button>
            </div>
            <p>Choose one or more. Results update as you select.</p>
            <div class="category-options"></div>
          </div>
          <div
            id="date-menu"
            class="filter-menu"
            role="dialog"
            aria-label="Date"
            hidden
          >
            <div class="menu-heading">
              <strong>Date</strong
              ><button type="button" data-close aria-label="Close dates">
                <img src="assets/discovery/close.svg" alt="" />
              </button>
            </div>
            <div class="date-presets">
              <button type="button" data-date="any">
                Any upcoming date <small>From today</small>
              </button>
              <button type="button" data-date="today">Today</button>
              <button type="button" data-date="tomorrow">Tomorrow</button>
              <button type="button" data-date="weekend">This weekend</button>
              <button type="button" data-date="custom">
                Custom date or range <small>Today or later</small>
              </button>
            </div>
          </div>
          <div
            id="custom-menu"
            class="filter-menu custom-menu"
            role="dialog"
            aria-label="Custom dates"
            hidden
          >
            <div class="menu-heading">
              <strong>Custom dates</strong
              ><button type="button" data-close aria-label="Close custom dates">
                <img src="assets/discovery/close.svg" alt="" />
              </button>
            </div>
            <p id="date-format">
              Format: DD MMM YYYY · Novi Sad time · Today or later
            </p>
            <div class="date-modes">
              <button type="button" id="mode-single" aria-pressed="true">
                Single date</button
              ><button type="button" id="mode-range" aria-pressed="false">
                Date range
              </button>
            </div>
            <div class="date-inputs">
              <label
                ><span id="start-label">Date</span
                ><span class="date-input"
                  ><input
                    id="custom-start"
                    placeholder="DD MMM YYYY"
                    aria-describedby="date-format date-feedback"
                    autocomplete="off" /><img
                    src="assets/discovery/calendar.svg"
                    alt="" /></span
              ></label>
              <label id="end-label" hidden
                >To<span class="date-input"
                  ><input
                    id="custom-end"
                    placeholder="DD MMM YYYY"
                    aria-describedby="date-format date-feedback"
                    autocomplete="off" /><img
                    src="assets/discovery/calendar.svg"
                    alt="" /></span
              ></label>
            </div>
            <p id="date-feedback" role="status"></p>
            <div class="calendar-heading">
              <button
                type="button"
                id="previous-month"
                aria-label="Previous month"
              >
                <img src="assets/discovery/left.svg" alt="" /></button
              ><strong id="calendar-month"></strong
              ><button type="button" id="next-month" aria-label="Next month">
                <img src="assets/discovery/right.svg" alt="" />
              </button>
            </div>
            <div id="calendar" role="grid" aria-label="Choose date"></div>
            <p id="calendar-note"></p>
            <div class="date-footer">
              <button type="button" id="clear-date">Clear date</button
              ><button type="button" data-close>Close</button>
            </div>
          </div>
          <div class="result-heading">
            <p id="status" role="status" aria-live="polite"></p>
            <button id="clear-all" type="button" hidden>Clear all</button>
          </div>
          <p id="discovery-notice" role="status" hidden></p>
          <div
            id="results"
            role="region"
            aria-label="Event results"
            tabindex="0"
          >
            <div id="event-list" aria-busy="true"></div>
            <div id="page-status" role="status" aria-live="polite"></div>
            <div id="results-sentinel" aria-hidden="true"></div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
