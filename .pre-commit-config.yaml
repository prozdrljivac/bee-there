repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: uv --directory backend run ruff check --fix .
        language: system
        pass_filenames: false
      - id: ruff-format
        name: Ruff format
        entry: uv --directory backend run ruff format --check .
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv --directory backend run mypy
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv --directory backend run pytest
        language: system
        pass_filenames: false
