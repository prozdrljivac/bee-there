repos:
  - repo: local
    hooks:
      - id: conventional-commit
        name: Conventional Commit message
        entry: uv run --project backend python backend/scripts/check_commit_message.py
        language: system
        stages: [commit-msg]
      - id: ruff-check
        name: Ruff check
        entry: uv --directory backend run ruff check --fix .
        language: system
        pass_filenames: false
      - id: ruff-format
        name: Ruff format
        entry: uv --directory backend run ruff format --check .
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv --directory backend run mypy
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv --directory backend run pytest
        language: system
        pass_filenames: false
