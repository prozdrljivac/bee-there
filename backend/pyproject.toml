[project]
name = "bee-there"
version = "0.1.0"
description = "Event aggregation backend for BeeThere"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.1,<2",
    "fastapi>=0.162.0,<0.163",
    "pydantic>=2.14.1,<3",
    "sqlalchemy>=2.1.6,<2.2",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0,<3",
    "mypy==2.4.0",
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
]

[tool.uv]
required-version = ">=0.13.5,<0.14"
package = false

[tool.ruff]
target-version = "py314"
line-length = 80

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["api", "infrastructure", "modules"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true


[tool.alembic]

# path to migration scripts.
# this is typically a path given in POSIX (e.g. forward slashes)
# format, relative to the token %(here)s which refers to the location of this
# ini file
script_location = "%(here)s/migrations"

# additional paths to be prepended to sys.path. defaults to the current working directory.
prepend_sys_path = [
    "%(here)s/src"
]
